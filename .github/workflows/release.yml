name: Release

on:
  push:
    tags: ['v*']
  pull_request:
    paths: ['.github/workflows/release.yml']

permissions:
  contents: read

jobs:
  build:
    name: build (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: macos-latest, target: aarch64-apple-darwin }
          - { os: macos-latest, target: x86_64-apple-darwin }
          - { os: ubuntu-latest, target: x86_64-unknown-linux-gnu }
          - { os: windows-latest, target: x86_64-pc-windows-msvc }
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - run: cargo build --release --locked -p freemiele-cli --target ${{ matrix.target }}
      - name: Package
        shell: bash
        run: |
          name="miele-${{ github.ref_type == 'tag' && github.ref_name || 'test' }}-${{ matrix.target }}"
          mkdir "$name"
          cp LICENSE README.md "$name"/
          if [ "${{ runner.os }}" = Windows ]; then
            cp "target/${{ matrix.target }}/release/miele.exe" "$name"/
            7z a "$name.zip" "$name" > /dev/null
            echo "ASSET=$name.zip" >> "$GITHUB_ENV"
          else
            cp "target/${{ matrix.target }}/release/miele" "$name"/
            tar czf "$name.tar.gz" "$name"
            echo "ASSET=$name.tar.gz" >> "$GITHUB_ENV"
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: miele-${{ matrix.target }}
          path: ${{ env.ASSET }}

  app:
    name: build (Mac app)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin
      # One universal app runs on both Apple silicon and Intel Macs: one job, one download.
      - run: cargo install tauri-cli --version '^2' --locked
      - run: cargo tauri build --target universal-apple-darwin --bundles app
      - name: Zip
        run: |
          name="freeMiele-${{ github.ref_type == 'tag' && github.ref_name || 'test' }}-macos"
          ditto -c -k --keepParent target/universal-apple-darwin/release/bundle/macos/freeMiele.app "$name.zip"
          echo "ASSET=$name.zip" >> "$GITHUB_ENV"
      - uses: actions/upload-artifact@v4
        with:
          name: freeMiele-app
          path: ${{ env.ASSET }}

  publish:
    if: github.ref_type == 'tag'
    needs: [build, app]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "$GITHUB_REF_NAME" -R "$GITHUB_REPOSITORY" >/dev/null 2>&1 \
            || gh release create "$GITHUB_REF_NAME" -R "$GITHUB_REPOSITORY" --generate-notes
          gh release upload "$GITHUB_REF_NAME" dist/* -R "$GITHUB_REPOSITORY" --clobber

  # Does nothing until the HOMEBREW_TAP_TOKEN secret exists (see packaging/homebrew/README.md).
  tap:
    if: github.ref_type == 'tag'
    needs: publish
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - env:
          GH_TOKEN: ${{ github.token }}
          TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        run: |
          [ -n "$TAP_TOKEN" ] || { echo "No HOMEBREW_TAP_TOKEN; skipping."; exit 0; }
          t="$GITHUB_REF_NAME"
          gh release download "$t" -R "$GITHUB_REPOSITORY" -D dist
          sha() { sha256sum "dist/$1" | cut -d' ' -f1; }
          git clone "https://x-access-token:$TAP_TOKEN@github.com/cubetes/homebrew-freemiele.git" tap
          mkdir -p tap/Formula tap/Casks
          sed -e "s/@VERSION@/${t#v}/" \
              -e "s/@SHA_MAC_ARM@/$(sha miele-$t-aarch64-apple-darwin.tar.gz)/" \
              -e "s/@SHA_MAC_INTEL@/$(sha miele-$t-x86_64-apple-darwin.tar.gz)/" \
              -e "s/@SHA_LINUX@/$(sha miele-$t-x86_64-unknown-linux-gnu.tar.gz)/" \
              packaging/homebrew/Formula/miele.rb > tap/Formula/miele.rb
          sed -e "s/@VERSION@/${t#v}/" -e "s/@SHA_APP@/$(sha freeMiele-$t-macos.zip)/" \
              packaging/homebrew/Casks/freemiele.rb > tap/Casks/freemiele.rb
          cd tap
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "miele ${t#v}" && git push
