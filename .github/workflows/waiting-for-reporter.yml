name: Waiting for reporter

# Close issues labelled "waiting for reporter" after 21 days without a reply,
# and drop the label as soon as the person who opened the issue answers.
on:
  schedule:
    - cron: "17 6 * * *"
  issue_comment:
    types: [created]

permissions:
  issues: write

jobs:
  reply:
    if: >-
      github.event_name == 'issue_comment' &&
      github.event.comment.user.login == github.event.issue.user.login &&
      contains(github.event.issue.labels.*.name, 'waiting for reporter')
    runs-on: ubuntu-latest
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
        run: gh issue edit ${{ github.event.issue.number }} -R ${{ github.repository }} --remove-label "waiting for reporter"

  close:
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cutoff=$(date -u -d '21 days ago' +%Y-%m-%dT%H:%M:%SZ)
          gh issue list -R ${{ github.repository }} --label "waiting for reporter" --state open \
            --json number,updatedAt --jq ".[] | select(.updatedAt < \"$cutoff\") | .number" |
          while read -r n; do
            gh issue close "$n" -R ${{ github.repository }} --comment "Closing because we haven't heard back in 21 days. That's fine: reply here with the details whenever you can and we'll reopen it."
          done
