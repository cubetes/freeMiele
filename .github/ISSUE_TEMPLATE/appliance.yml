name: Appliance support report
description: Tell us what works (and what doesn't) with your Miele appliance.
labels: ["appliance support"]
body:
  - type: markdown
    attributes:
      value: |
        What the API allows differs by model, so reports from real machines are the most useful contribution.
        Run `miele dump > appliance.json` and attach the file. It removes serial numbers and names, but check it first. Never paste tokens or your client secret.
  - type: input
    id: model
    attributes:
      label: Model and type
      placeholder: e.g. CM 6160, coffee machine
    validations:
      required: true
  - type: textarea
    id: dump
    attributes:
      label: Attach appliance.json
      description: Drag the file from `miele dump > appliance.json` into this box.
  - type: checkboxes
    id: works
    attributes:
      label: Which commands work?
      options:
        - label: status
        - label: on / off
        - label: brew (or starting a program)
  - type: textarea
    id: actions
    attributes:
      label: Reply of GET /devices/{id}/actions (optional, if `miele dump` doesn't work)
      description: Replace every serial number with zeros first.
      render: json
  - type: textarea
    id: programs
    attributes:
      label: Reply of GET /devices/{id}/programs (optional)
      render: json
  - type: textarea
    id: notes
    attributes:
      label: Anything else
      description: e.g. settings you had to enable on the machine, such as Mobile Start.
