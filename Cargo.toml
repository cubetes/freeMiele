[workspace]
members = ["crates/*"]
resolver = "3"

[workspace.package]
version = "0.3.1"
edition = "2024"
license = "AGPL-3.0-or-later"

[workspace.dependencies]
clap = { version = "4.6.7", features = ["derive"] }
keyring = { version = "3", features = ["apple-native"] }
reqwest = { version = "0.13.5", features = ["blocking", "form", "json"] }
rpassword = "7.5.4"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.152"
